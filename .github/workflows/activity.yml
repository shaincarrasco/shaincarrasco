name: Update activity

on:
  schedule:
    - cron: "17 11 * * *" # daily, 05:17 Chicago (CST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/activity.yml"]

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Draw the contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/activity.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg README.md
          git diff --cached --quiet || (git commit -m "Update activity" && git push)
