name: Sync from site

on:
  schedule:
    - cron: "41 * * * *" # hourly; a no-op unless the site changed
  repository_dispatch:
    types: [site-deployed] # sent by the site's deploy workflow when PROFILE_SYNC_TOKEN is set
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/sync_site.py", ".github/workflows/sync-site.yml"]

permissions:
  contents: write

concurrency:
  group: profile-writes # shared with the activity job so the two never race on README.md
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull banner and selected work from shaincarrasco.github.io
        run: python3 scripts/sync_site.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg README.md
          git diff --cached --quiet && exit 0
          git commit -m "Sync from site"
          git pull --rebase && git push
